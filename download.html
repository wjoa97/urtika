<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargando dist.zip - Urtika UAS7</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
      color: #38bdf8;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      margin: 0 0 24px 0;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>Descarga de dist.zip</h1>
    <p>Tu archivo se está descargando automáticamente. Si la descarga no se inicia en unos segundos, haz clic en el botón de abajo:</p>
    <a href="/dist.zip" download="dist.zip" class="btn">⬇️ Descargar dist.zip (660 KB)</a>
    <div class="info">Urtika · Versión de producción limpia lista para Cloudflare Pages</div>
  </div>

  <script>
    // Automatic trigger on load
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const link = document.createElement('a');
        link.href = '/dist.zip';
        link.download = 'dist.zip';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }, 500);
    });
  </script>
</body>
</html>
